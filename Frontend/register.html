<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Complaint Registration Platform</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-container">
    <div class="glass-card">
      <h1>Create Account</h1>
      
      <!-- Step 1: Request OTP -->
      <form id="registerForm">
        <div id="registerAlert" class="alert error"></div>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required>
        </div>
        <button type="submit" class="mt-4">Send OTP</button>
        <p class="text-center mt-6 text-muted">
          Already have an account? <a href="index.html">Login here</a>
        </p>
      </form>

      <!-- Step 2: Verify OTP -->
      <form id="otpForm" class="hidden">
        <div class="alert success" style="display:block">OTP sent to your email!</div>
        <div class="form-group mt-4">
          <label for="otp">Enter 6-digit OTP</label>
          <input type="text" id="otp" required maxlength="6" pattern="[0-9]{6}">
        </div>
        <button type="submit" class="mt-4">Verify OTP</button>
      </form>

      <!-- Step 3: Set Password -->
      <form id="passwordForm" class="hidden">
        <div id="passwordAlert" class="alert error"></div>
        <div class="form-group">
          <label for="password">Create Password</label>
          <input type="password" id="password" required>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" required>
        </div>
        <button type="submit" class="mt-4">Complete Registration</button>
      </form>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
